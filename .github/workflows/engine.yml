name: Engine

# Builds the engine from upstream source plus our patch set, and publishes one
# artifact per target the desktop ships.
#
# This is deliberately a separate workflow from Release. It has never run, and a
# mistake here must not be able to break a release. Once it has passed, the
# desktop jobs in release.yml can start consuming its artifacts: download the
# artifact for the platform, then set MITTRCRAFT_ENGINE_BINARY to the binary path
# before the packaging step, which makes prepare-opencode-cli install it instead
# of downloading from upstream.

on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/**'
      - 'scripts/build-engine.mjs'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

jobs:
  build-engine:
    # Bun cross-compiles every target from one machine, so this does not need a
    # runner per platform. Cross-compilation is proven from a macOS host; from a
    # Linux host it is not, and this first run is the test. If it fails while
    # producing some targets and not others, switch to macos-26 before assuming
    # the patch set is at fault.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Read pinned upstream version
        id: upstream
        run: echo "version=$(cat engine/UPSTREAM_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: node scripts/build-engine.mjs --all --work "$RUNNER_TEMP/engine"

      - name: Report what was built
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/engine/opencode/packages/opencode/dist"
          ls -1 "$DIST"
          du -sh "$DIST"

      # One artifact per target, so each desktop job downloads only its own
      # binary rather than two gigabytes of everything.
      #
      # These five names are what packages/electron/scripts/prepare-opencode-cli.mjs
      # maps each platform to. Windows arm64 deliberately ships the x64 baseline
      # build while an upstream arm64 bug is open, which is why there is no
      # windows-arm64 artifact here.
      - name: Upload darwin-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-darwin-arm64-${{ steps.upstream.outputs.version }}
          path: ${{ runner.temp }}/engine/opencode/packages/opencode/dist/opencode-darwin-arm64/bin/*
          if-no-files-found: error

      - name: Upload darwin-x64-baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-darwin-x64-baseline-${{ steps.upstream.outputs.version }}
          path: ${{ runner.temp }}/engine/opencode/packages/opencode/dist/opencode-darwin-x64-baseline/bin/*
          if-no-files-found: error

      - name: Upload windows-x64-baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-windows-x64-baseline-${{ steps.upstream.outputs.version }}
          path: ${{ runner.temp }}/engine/opencode/packages/opencode/dist/opencode-windows-x64-baseline/bin/*
          if-no-files-found: error

      - name: Upload linux-x64-baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-linux-x64-baseline-${{ steps.upstream.outputs.version }}
          path: ${{ runner.temp }}/engine/opencode/packages/opencode/dist/opencode-linux-x64-baseline/bin/*
          if-no-files-found: error

      - name: Upload linux-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-linux-arm64-${{ steps.upstream.outputs.version }}
          path: ${{ runner.temp }}/engine/opencode/packages/opencode/dist/opencode-linux-arm64/bin/*
          if-no-files-found: error
