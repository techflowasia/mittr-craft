services:
  mittrcraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mittrcraft
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/mittrcraft:/home/mittrcraft/.config/mittrcraft
      - ./data/opencode/share:/home/mittrcraft/.local/share/opencode
      - ./data/opencode/state:/home/mittrcraft/.local/state/opencode
      - ./data/opencode/config:/home/mittrcraft/.config/opencode
      - ./data/ssh:/home/mittrcraft/.ssh
      - ./workspaces:/home/mittrcraft/workspaces
    environment:
      # Docker binds MittrCraft to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   MITTRCRAFT_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      MITTRCRAFT_UI_PASSWORD: ${MITTRCRAFT_UI_PASSWORD:?Set MITTRCRAFT_UI_PASSWORD before exposing MittrCraft through Docker}
    # MITTRCRAFT_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # MITTRCRAFT_TUNNEL_PROVIDER: cloudflare
    # MITTRCRAFT_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # MITTRCRAFT_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # MITTRCRAFT_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # MITTRCRAFT_TUNNEL_CONFIG: /home/mittrcraft/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # MITTRCRAFT_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
